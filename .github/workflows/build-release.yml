name: Build & Release

# 推送 v* 标签 → 自动打包并发布到 GitHub Release
# 或在 Actions 页面手动触发 → 打包结果以 Artifact 提供（不创建 Release）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows exe
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build app (electron-vite)
        run: npm run build

      - name: Package portable exe
        # 缓存型便携版：electron-builder --dir + 自研 NSIS 启动器 stub（scripts/build-portable.mjs）
        # 首启解压到 %LOCALAPPDATA% 缓存、之后直启。NSIS 工具链由脚本自动准备（复用缓存或官方源下载+校验）。
        # 安装版（NSIS 安装包）按要求暂停，见 AI_Should_Read/INSTALLER.md
        # 不需要代码签名；禁用 electron-builder 自动探测证书
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --dir && node scripts/build-portable.mjs

      - name: Upload build artifacts (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: BoothAtelier-windows
          path: dist/*portable.exe
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release & upload assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*portable.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
